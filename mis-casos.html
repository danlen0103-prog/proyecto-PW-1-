<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="mis.title">Mis casos · Reporta tu barrio</title>
  <meta name="description" content="Los casos que has publicado y su estado.">
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
  <link href="css/pantallas.css" rel="stylesheet">
</head>
<body>
  <div id="encabezado"></div>

  <main id="contenido" tabindex="-1">
    <div class="container my-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h2 mb-0" data-i18n="mis.h1">Mis casos</h1>
        <a href="publicar.html" class="btn btn-primary" data-i18n="comun.publicarCaso">Publicar un caso</a>
      </div>
      <p id="contador" class="text-body-secondary" aria-live="polite"></p>

        <div id="msgCargando" class="text-center py-5" role="status">
          <div class="spinner-border text-primary" aria-hidden="true"></div>
          <p class="mt-3 mb-0" data-i18n="comun.cargando">Cargando…</p>
        </div>
        <div id="msgVacio" class="alert alert-light border d-none" role="status"><span data-i18n="mis.vacio">Aún no has publicado ningún caso.</span> <a href="publicar.html" data-i18n="mis.vacioLink">Publica el primero</a>.</div>
        <div id="msgError" class="alert alert-danger d-none" role="alert">
          <strong data-i18n="comun.problema">Ocurrió un problema.</strong> <span class="detalle"></span>
        </div>

      <div id="zonaTabla" class="d-none">
        <div class="table-responsive card tabla-tarjeta">
          <table id="tabla" class="table table-hover align-middle mb-0">
            <caption class="visually-hidden" data-i18n="mis.caption">Casos publicados por ti</caption>
            <thead>
              <tr>
                <th scope="col" data-i18n="th.caso">Caso</th>
                <th scope="col" data-i18n="th.publicado">Publicado</th>
                <th scope="col" data-i18n="filtro.estado">Estado</th>
                <th scope="col" class="text-end" data-i18n="comun.apoyos">Apoyos</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mis-casos.js"></script>
</body>
</html>
