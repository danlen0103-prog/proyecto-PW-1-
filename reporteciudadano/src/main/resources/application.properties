spring.application.name=reporteciudadano

spring.datasource.url=jdbc:postgresql://localhost:5432/reporte_ciudadano
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-reporte-ciudadano-2026-usco}
app.jwt.expiration-ms=28800000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.dir=uploads

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD:reporte123}
server.ssl.key-alias=reporte
