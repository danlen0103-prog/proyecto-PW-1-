<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="det.title">Detalle del caso · Reporta tu barrio</title>
  <meta name="description" content="Foto, ubicación, historial y apoyos de un caso publicado.">
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="css/estilos.css" rel="stylesheet">
  <link href="css/pantallas.css" rel="stylesheet">
</head>
<body>
  <div id="encabezado"></div>

  <main id="contenido" tabindex="-1">
    <div class="container my-4">
      <a href="index.html" class="d-inline-block mb-3" data-i18n="det.volver">← Volver a los casos</a>

      <div id="cargando" class="text-center py-5" role="status">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <p class="mt-3 mb-0" data-i18n="det.cargando">Cargando el caso…</p>
      </div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>

      <article id="caso" class="d-none">
        <div class="row g-4">
          <div class="col-12 col-lg-7">
            <img id="dFoto" class="img-fluid foto-detalle w-100" alt="">
            <section id="bloqueMapa" class="mt-4 d-none" aria-labelledby="tUbicacion">
              <h2 id="tUbicacion" class="h5" data-i18n="det.ubicacion">Ubicación</h2>
              <p id="dReferencia" class="text-body-secondary"></p>
              <div id="dMapa" role="region" aria-label="Mapa con la ubicación del caso" data-i18n-aria="det.mapaAria"></div>
            </section>
          </div>

          <div class="col-12 col-lg-5">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
              <span id="dEstado"></span>
              <span id="dFecha" class="small text-body-secondary"></span>
            </div>
            <h1 id="dTipo" class="h2"></h1>
            <p id="dBarrio" class="text-body-secondary mb-3"></p>
            <p id="dDescripcion" class="descripcion"></p>

            <div class="row g-3 my-3">
              <div class="col-6">
                <div class="card tarjeta-resumen text-center h-100"><div class="card-body py-3">
                  <div id="dVotos" class="numero" aria-live="polite">0</div>
                  <div class="small text-body-secondary" data-i18n="comun.apoyos">Apoyos</div>
                </div></div>
              </div>
              <div class="col-6">
                <div class="card tarjeta-resumen text-center h-100"><div class="card-body py-3">
                  <div id="dPuntaje" class="numero">—</div>
                  <div class="small text-body-secondary" data-i18n="comun.prioridad">Prioridad</div>
                </div></div>
              </div>
            </div>
            <p class="small text-body-secondary" data-i18n="det.prioridadAyuda">La prioridad combina la gravedad del tipo de problema, los apoyos de los vecinos y los días que el caso lleva sin resolverse.</p>

            <div id="zonaVoto" class="mb-4"></div>
            <div id="cierre"></div>

            <section aria-labelledby="tHistorial">
              <h2 id="tHistorial" class="h5" data-i18n="det.historial">Historial del caso</h2>
              <ol id="historial" class="linea-tiempo list-unstyled"></ol>
            </section>
          </div>
        </div>
      </article>
    </div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/detalle.js"></script>
</body>
</html>
