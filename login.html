<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="login.title">Ingresar · Reporta tu barrio</title>
  <meta name="description" content="Inicia sesión para publicar o gestionar casos.">
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="encabezado"></div>

  <main id="contenido" tabindex="-1">
    <div class="container">
      <div class="card tarjeta-auth shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-1" data-i18n="login.h1">Ingresar</h1>
          <p class="text-body-secondary mb-4" data-i18n="login.ayuda">Usa tu correo y tu clave. Es el mismo ingreso para ciudadanos y personal.</p>

          <div id="alerta"></div>

          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="correo" class="form-label" data-i18n="form.correo">Correo</label>
              <input type="email" class="form-control" id="correo" autocomplete="username" required>
              <div class="invalid-feedback" id="correoError"></div>
            </div>
            <div class="mb-4">
              <label for="clave" class="form-label" data-i18n="form.clave">Clave</label>
              <div class="input-group has-validation">
                <input type="password" class="form-control" id="clave" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary btn-mostrar" type="button" data-target="#clave"
                        aria-pressed="false">Mostrar</button>
                <div class="invalid-feedback" id="claveError"></div>
              </div>
            </div>
            <div class="d-grid">
              <button id="btnEntrar" type="submit" class="btn btn-primary btn-lg" data-i18n="login.entrar">Ingresar</button>
            </div>
          </form>

          <p class="text-center mt-4 mb-0"><span data-i18n="login.sinCuenta">¿No tienes cuenta?</span> <a href="registro.html" data-i18n="login.registrate">Regístrate</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
