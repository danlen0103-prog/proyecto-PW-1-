<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="reg.title">Crear cuenta · Reporta tu barrio</title>
  <meta name="description" content="Crea tu cuenta de ciudadano para publicar y apoyar casos.">
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="encabezado"></div>

  <main id="contenido" tabindex="-1">
    <div class="container">
      <div class="card tarjeta-auth shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-1" data-i18n="reg.h1">Crear cuenta</h1>
          <p class="text-body-secondary mb-4" data-i18n="reg.ayuda">Con tu cuenta puedes publicar casos y apoyar los de tus vecinos.</p>

          <div id="alerta"></div>

          <form id="formRegistro" novalidate>
            <div class="mb-3">
              <label for="nombre" class="form-label" data-i18n="form.nombre">Nombre</label>
              <input type="text" class="form-control" id="nombre" autocomplete="name" maxlength="100" required>
              <div class="invalid-feedback" id="nombreError"></div>
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label" data-i18n="form.correo">Correo</label>
              <input type="email" class="form-control" id="correo" autocomplete="username" maxlength="120" required>
              <div class="invalid-feedback" id="correoError"></div>
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label" data-i18n="form.clave">Clave</label>
              <div class="input-group has-validation">
                <input type="password" class="form-control" id="clave" autocomplete="new-password"
                       maxlength="60" data-ayuda="ayudaClave" aria-describedby="ayudaClave" required>
                <button class="btn btn-outline-secondary btn-mostrar" type="button" data-target="#clave"
                        aria-pressed="false">Mostrar</button>
                <div class="invalid-feedback" id="claveError"></div>
              </div>
              <div id="ayudaClave" class="form-text" data-i18n="reg.ayudaClave">Mínimo 8 caracteres.</div>
            </div>
            <div class="mb-4">
              <label for="confirmar" class="form-label" data-i18n="reg.confirmar">Repite la clave</label>
              <input type="password" class="form-control" id="confirmar" autocomplete="new-password" maxlength="60" required>
              <div class="invalid-feedback" id="confirmarError"></div>
            </div>
            <div class="d-grid">
              <button id="btnRegistrar" type="submit" class="btn btn-primary btn-lg" data-i18n="reg.crear">Crear cuenta</button>
            </div>
          </form>

          <p class="text-body-secondary small mt-3 mb-0" data-i18n="reg.privacidad">Usamos tu correo solo para identificarte en la plataforma.</p>
          <p class="text-center mt-3 mb-0"><span data-i18n="reg.yaTienes">¿Ya tienes cuenta?</span> <a href="login.html" data-i18n="reg.ingresa">Ingresa</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
